<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Arena - Neon Retro</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="app">
        <header class="game-header">
            <h1 class="neon-title">SNAKE ARENA</h1>
        </header>
        
        <div class="game-layout">
            <main class="game-container">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
                <div id="game-status" class="game-status">Press SPACE to start</div>
            </main>
            
            <aside class="score-sidebar">
                <div class="score-header">
                    <h2 class="score-title">SCORES</h2>
                </div>
                
                <div class="score-section player-section">
                    <div class="score-label">PLAYER</div>
                    <div class="score-value" id="player-score">0</div>
                    <div class="score-details">
                        <div class="length-display" id="player-length">Length: 3</div>
                        <div class="score-bar-container">
                            <div class="score-bar player-bar" id="player-score-bar"></div>
                        </div>
                    </div>
                </div>
                
                <div class="score-section ai-section">
                    <div class="score-label">AI RIVAL</div>
                    <div class="score-value" id="ai-score">0</div>
                    <div class="score-details">
                        <div class="length-display" id="ai-length">Length: 3</div>
                        <div class="score-bar-container">
                            <div class="score-bar ai-bar" id="ai-score-bar"></div>
                        </div>
                    </div>
                </div>
                
                <div class="score-stats">
                    <div class="stat-item">
                        <span class="stat-label">Total Food:</span>
                        <span class="stat-value" id="total-food">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Leader:</span>
                        <span class="stat-value" id="current-leader">Tie</span>
                    </div>
                </div>
            </aside>
        </div>
        
        <footer class="game-controls">
            <div class="controls-info">
                <p>Use ARROW KEYS or WASD to move</p>
                <p>SPACE to pause/resume • R to restart</p>
            </div>
        </footer>
    </div>
    
    <script type="module" src="src/main.ts"></script>
</body>
</html>
